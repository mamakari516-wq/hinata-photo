<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65bde9"><title>みんなのすてきな瞬間</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f9ff;color:#36566b;font-family:system-ui,'Noto Sans JP',sans-serif}header{padding:14px 16px;background:#fff;border-bottom:3px solid #b8eaff}h1{margin:0;font-size:clamp(21px,4vw,30px);color:#45a9df}header small{display:block;margin-top:5px}main{max-width:1200px;margin:auto;padding:12px}.panel{background:white;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px #bfdde855}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{border:0;background:#e2f4ff;color:#236e99;border-radius:12px;padding:13px 16px;min-height:48px;font-size:15px;font-weight:700;touch-action:manipulation}button:disabled{opacity:.45}button.primary{background:#45a9df;color:white}button.danger{background:#ffeded;color:#ad4656}label{display:flex;gap:7px;align-items:center;flex-wrap:wrap}input[type=month],input[type=text]{font-size:16px;min-height:44px;border:1px solid #b9d8e7;border-radius:9px;padding:8px;max-width:170px}input[type=range]{width:min(200px,42vw);accent-color:#43a8de}.preview{overflow:hidden;border-radius:12px;background:#dceaf3;padding:6px}canvas{display:block;width:100%;height:auto;touch-action:none;background:white;border-radius:5px;box-shadow:0 2px 8px #8da9b7}p{font-size:13px;line-height:1.6}.hint{color:#58778b}#file{display:none}#status{font-weight:700;min-height:1.5em}footer{font-size:12px;color:#637d8e;margin:14px 0 30px}@media(max-width:550px){main{padding:7px}.panel{padding:10px}button{flex:1 1 auto}.actions{gap:6px}}
</style></head><body><header><h1>☁ みんなのすてきな瞬間 ☀</h1><small>Androidタブレット対応・写真だより作成</small></header><main><div class="panel actions"><label>年月 <input id="month" type="month"></label><button id="add">＋ 写真枠を追加</button><button id="minus">－ 最後の枠を減らす</button><button id="replace">📷 選択枠の写真を変更</button><button id="remove" class="danger">選択した写真を削除</button></div><div class="panel actions"><label>写真の拡大 <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label><button id="reset">位置・拡大を戻す</button><button id="save" class="primary">JPEGを保存（2MB以内）</button></div><div class="preview"><canvas id="preview" width="1122" height="794" aria-label="写真だよりのプレビュー"></canvas></div><p class="hint">写真枠をタップして写真を追加。写真を入れた後は、指で動かして位置を調整できます。拡大は上のスライダーで調整できます。写真の枠は8個から始まります。</p><p id="status" role="status"></p><footer>写真はこの端末の中だけで処理され、公開サイトへ送信されません。編集中の内容は保存されないため、完成したら必ずJPEG保存してください。保存先はAndroidの「ダウンロード」などで確認できます。</footer><input id="file" type="file" accept="image/*"></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('preview'),ctx=canvas.getContext('2d'),W=1122,H=794;let slots=Array.from({length:8},()=>({img:null,url:null,z:1,x:0,y:0})),selected=-1,drag=null;const status=t=>$('status').textContent=t;const month=$('month');{const d=new Date();month.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function layout(){const rows=Math.ceil(slots.length/4),gap=12,x0=34,y0=137,cw=(1054-3*gap)/4,cellH=552/rows;return slots.map((s,i)=>({x:x0+(i%4)*(cw+gap),y:y0+Math.floor(i/4)*cellH,w:cw,h:cellH-gap}))}
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function draw(c){c.fillStyle='#fffdf7';c.fillRect(0,0,W,H);c.strokeStyle='#cbeaf7';c.lineWidth=4;c.setLineDash([9,7]);rounded(c,12,12,1098,770,22);c.stroke();c.setLineDash([]);c.fillStyle='#65bde9';c.textAlign='left';c.font='bold 45px sans-serif';c.fillText('みんなのすてきな瞬間',43,83);c.fillStyle='#f3a75f';c.font='19px sans-serif';c.fillText('✿ たのしい毎日、キラキラの笑顔 ✿',44,116);c.fillStyle='#829bb2';c.textAlign='right';c.font='17px sans-serif';c.fillText(month.value?month.value.replace('-','年')+'月':'',1071,112);layout().forEach((r,i)=>{const s=slots[i];c.fillStyle='#f1faff';rounded(c,r.x,r.y,r.w,r.h,12);c.fill();c.save();rounded(c,r.x,r.y,r.w,r.h,12);c.clip();if(s.img){const img=s.img,scale=Math.max(r.w/img.width,r.h/img.height)*s.z;const dw=img.width*scale,dh=img.height*scale;c.drawImage(img,r.x+(r.w-dw)/2+s.x,r.y+(r.h-dh)/2+s.y,dw,dh)}else{c.fillStyle='#89b4c9';c.textAlign='center';c.font='17px sans-serif';c.fillText('＋ 写真を追加',r.x+r.w/2,r.y+r.h/2)}c.restore();if(c===ctx){c.strokeStyle=i===selected?'#f2a451':'#b8ddea';c.lineWidth=i===selected?5:2;c.setLineDash(i===selected?[]:[7,5]);rounded(c,r.x,r.y,r.w,r.h,12);c.stroke();c.setLineDash([])}});c.textAlign='center';c.fillStyle='#93b9cb';c.font='15px sans-serif';c.fillText('✿ ひとつひとつの瞬間が、たいせつな宝物 ✿',561,775)}
function render(){draw(ctx);const s=slots[selected];$('zoom').disabled=!s?.img;$('zoom').value=s?.z||1;$('reset').disabled=!s?.img;$('remove').disabled=!s?.img;$('replace').disabled=selected<0;$('minus').disabled=slots.length<=1;$('add').disabled=slots.length>=24}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function hit(p){return layout().findIndex(r=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)}
canvas.addEventListener('pointerdown',e=>{const p=point(e),i=hit(p);if(i<0)return;selected=i;const s=slots[i];if(s.img){drag={id:e.pointerId,x:p.x,y:p.y,ox:s.x,oy:s.y,i};canvas.setPointerCapture(e.pointerId)}else{$('file').click()}render()});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e),s=slots[drag.i];s.x=drag.ox+p.x-drag.x;s.y=drag.oy+p.y-drag.y;render()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
$('file').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(!f||selected<0)return;if(!f.type.startsWith('image/')){status('画像ファイルを選んでください');return}try{const url=URL.createObjectURL(f);const img=await new Promise((ok,bad)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=bad;im.src=url});const old=slots[selected];if(old.url)URL.revokeObjectURL(old.url);slots[selected]={img,url,z:1,x:0,y:0};status('写真を追加しました');render()}catch(err){status('写真を読み込めませんでした。JPEGなどの画像で試してください')}};
$('add').onclick=()=>{if(slots.length<24)slots.push({img:null,url:null,z:1,x:0,y:0});render()};$('minus').onclick=()=>{if(slots.length<=1)return;const s=slots.pop();if(s.url)URL.revokeObjectURL(s.url);selected=Math.min(selected,slots.length-1);render()};$('replace').onclick=()=>{if(selected>=0)$('file').click()};$('remove').onclick=()=>{if(selected<0)return;const s=slots[selected];if(s.url)URL.revokeObjectURL(s.url);slots[selected]={img:null,url:null,z:1,x:0,y:0};render()};$('zoom').oninput=e=>{if(selected>=0&&slots[selected].img){slots[selected].z=+e.target.value;render()}};$('reset').onclick=()=>{const s=slots[selected];if(s){s.z=1;s.x=s.y=0;render()}};month.oninput=render;
const toBlob=(c,q)=>new Promise(ok=>c.toBlob(ok,'image/jpeg',q));$('save').onclick=async()=>{const b=$('save');b.disabled=true;status('JPEGを作成しています…');try{let blob=null;for(const factor of [3.126,2.6,2.1,1.6,1.25]){const c=document.createElement('canvas');c.width=Math.round(W*factor);c.height=Math.round(H*factor);const cc=c.getContext('2d');cc.scale(factor,factor);draw(cc);for(const q of [.88,.76,.63,.50,.38]){blob=await toBlob(c,q);if(blob&&blob.size<=2*1024*1024)break}if(blob&&blob.size<=2*1024*1024)break}if(!blob||blob.size>2*1024*1024)throw Error('容量を2MB以下にできませんでした');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='みんなのすてきな瞬間_'+month.value+'.jpg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);status('保存を開始しました（'+(blob.size/1024/1024).toFixed(2)+'MB）。ダウンロードフォルダを確認してください')}catch(err){status('保存できませんでした：'+err.message+'。写真を減らして再度お試しください')}finally{b.disabled=false}};render()})();
</script></body></html>
